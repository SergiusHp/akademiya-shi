<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Академія ШІ — інтерактивний курс зі штучного інтелекту</title>
<meta name="description" content="Безкоштовний інтерактивний курс українською: промпти, токени, дослідження, сайти, агенти й Telegram-боти. Уроки, практика, тести й власний прогрес у браузері.">
<meta property="og:title" content="Академія ШІ">
<meta property="og:description" content="Інтерактивний курс зі штучного інтелекту українською: від першого запиту до агентів і Telegram-ботів.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3044D0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233044D0'/%3E%3Crect x='6' y='19' width='20' height='7' rx='2' fill='%23FFD633'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Академія ШІ — дизайн-система
   Токени → база → компоненти → сторінки → адаптив
   ========================================================= */

/* ---------- 1. Токени ---------- */
.root{
  /* колір */
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EEF0F4; --surface-3:#E4E7ED;
  --border:#E1E4EA; --border-strong:#C9CED8;
  --text:#16181D; --text-2:#525A68; --text-3:#6B7280;
  --accent:#3044D0; --accent-hover:#2333B0; --accent-soft:#EBEEFD; --accent-text:#2B3CC0; --on-accent:#FFFFFF;
  --success:#0F7B53; --success-soft:#E3F4EC;
  --danger:#B3361A; --danger-soft:#FCEBE5;
  --warning:#875A00; --warning-soft:#FFF4D6;
  --mark:rgba(255,214,51,.55);
  --focus:0 0 0 3px rgba(48,68,208,.35);
  /* шрифти */
  --serif:'Literata','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Onest','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Courier New',monospace;
  /* шкала тексту */
  --fs-xs:13px; --fs-sm:14.5px; --fs-base:16.5px; --fs-md:18px; --fs-lg:21px; --fs-xl:26px; --fs-2xl:clamp(28px,3.2vw,36px); --fs-3xl:clamp(34px,4.8vw,54px);
  /* відступи */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:56px; --s10:72px; --s11:96px;
  /* форма */
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-full:999px;
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --sh-2:0 4px 8px -2px rgba(16,24,40,.06),0 12px 24px -6px rgba(16,24,40,.10);
  --sh-3:0 20px 48px -12px rgba(16,24,40,.25);
  --t:.18s ease;
  --w:1200px; --read:42rem;

  font-family:var(--sans);font-size:var(--fs-base);line-height:1.55;color:var(--text);background:var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background .3s,color .3s
}
.root.dark{
  --bg:#0F1115; --surface:#171A20; --surface-2:#1F232B; --surface-3:#282D37;
  --border:#2A2F39; --border-strong:#3A4150;
  --text:#E9ECF1; --text-2:#A6AEBC; --text-3:#8C95A4;
  --accent:#8C9CFF; --accent-hover:#A6B2FF; --accent-soft:#1D2341; --accent-text:#A9B4FF; --on-accent:#0F1115;
  --success:#5CD3A0; --success-soft:#12291F;
  --danger:#FF9C7E; --danger-soft:#33190F;
  --warning:#F2C462; --warning-soft:#2E2510;
  --mark:rgba(255,206,40,.30);
  --focus:0 0 0 3px rgba(140,156,255,.45);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 8px 24px -6px rgba(0,0,0,.5);
  --sh-3:0 24px 56px -12px rgba(0,0,0,.6)
}

/* ---------- 2. База ---------- */
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent-text);text-underline-offset:3px}
p{margin:0}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;text-wrap:balance}
h1{font-family:var(--serif);font-size:var(--fs-3xl);line-height:1.08;letter-spacing:-.02em}
h2{font-family:var(--serif);font-size:var(--fs-2xl);letter-spacing:-.015em}
h3{font-size:var(--fs-md);line-height:1.35}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--s6)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--text-2)}
.small{font-size:var(--fs-sm)}
.hide{display:none!important}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.skip{position:absolute;left:var(--s4);top:-60px;z-index:50;background:var(--accent);color:var(--on-accent);padding:var(--s2) var(--s4);border-radius:var(--r-sm);text-decoration:none;font-weight:600}
.skip:focus-visible{top:var(--s3)}

/* ---------- 3. Іконки ---------- */
.ico{display:inline-block;flex:none;width:1.2em;height:1.2em;background-color:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;vertical-align:-.2em}
.ico.lg{width:24px;height:24px}
.ico-tile{display:inline-flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text)}
.ico-tile .ico{width:22px;height:22px}

/* ---------- 4. Кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:550;font-size:var(--fs-base);cursor:pointer;text-decoration:none;transition:background var(--t),border-color var(--t),color var(--t),box-shadow var(--t);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.link{background:none;border:0;padding:8px 4px;color:var(--accent-text);min-height:44px}
.btn.link:hover{text-decoration:underline;background:none}
.btn.sm{min-height:40px;padding:7px 14px;font-size:var(--fs-sm)}
.btn.icon{width:44px;padding:0}
.btn.lg{min-height:52px;padding:12px 24px;font-size:var(--fs-md)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary:disabled{background:var(--accent);border-color:var(--accent)}
.btn-row{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center}

/* ---------- 5. Шапка й навігація ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--border)}
.topin{display:flex;align-items:center;gap:var(--s5);min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-family:var(--serif);font-weight:600;font-size:19px;padding:6px 2px;min-height:44px;color:var(--text);white-space:nowrap}
.logo{position:relative;width:24px;height:24px;border-radius:7px;background:var(--accent);flex:none}
.logo::after{content:'';position:absolute;left:4px;right:4px;bottom:5px;height:5px;border-radius:2px;background:#FFD633}
.nav{display:flex;gap:2px;flex:1;min-width:0}
.navb{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:8px 12px;min-height:44px;border-radius:var(--r-sm);color:var(--text-2);font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:color var(--t),background var(--t)}
.navb .ico{opacity:.8}
.navb:hover{color:var(--text);background:var(--surface-2)}
.navb[aria-current=page]{color:var(--accent-text);background:var(--accent-soft);font-weight:600}
.tools{display:flex;align-items:center;gap:var(--s2);margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-sm);color:var(--text-2);padding:6px 12px;border-radius:var(--r-full);background:var(--surface);border:1px solid var(--border);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill progress{width:56px}
.menu-btn{display:none}
.sheet-backdrop{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:30;animation:fade .2s ease}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(340px,88vw);background:var(--surface);z-index:31;box-shadow:var(--sh-3);display:flex;flex-direction:column;gap:var(--s2);padding:var(--s4);animation:slidein .25s cubic-bezier(.2,.7,.2,1);overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:0 0 var(--s3);border-bottom:1px solid var(--border);margin-bottom:var(--s2)}
.sheet .navb{font-size:var(--fs-base);padding:12px 14px;min-height:48px;justify-content:flex-start}
.sheet-foot{margin-top:auto;padding-top:var(--s4);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:var(--s3)}
@keyframes fade{from{opacity:0}}
@keyframes slidein{from{transform:translateX(100%)}}

/* ---------- 6. Прогрес-бари, бейджі, чіпи ---------- */
progress{appearance:none;-webkit-appearance:none;width:100%;height:6px;border:0;border-radius:var(--r-full);background:var(--surface-3);overflow:hidden;display:block}
progress::-webkit-progress-bar{background:var(--surface-3);border-radius:var(--r-full)}
progress::-webkit-progress-value{background:var(--accent);border-radius:var(--r-full);transition:width .5s ease}
progress::-moz-progress-bar{background:var(--accent);border-radius:var(--r-full)}
progress.ok::-webkit-progress-value{background:var(--success)}
progress.ok::-moz-progress-bar{background:var(--success)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;padding:3px 10px;border-radius:var(--r-full);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent-text)}
.badge.ok{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warning-soft);color:var(--warning)}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:var(--r-full);border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:var(--fs-sm);cursor:pointer;white-space:nowrap;transition:all var(--t)}
.chip:hover{border-color:var(--border-strong);color:var(--text)}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);color:var(--text-2);font-size:var(--fs-sm)}
.meta span{display:inline-flex;align-items:center;gap:6px}

/* ---------- 7. Поверхні ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s7);box-shadow:var(--sh-1);display:flex;flex-direction:column;gap:var(--s4)}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;gap:var(--s3);justify-content:space-between;flex-wrap:wrap}
.lbl{font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.alert{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4) var(--s5);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--fs-base);line-height:1.5}
.alert .ico{margin-top:3px}
.alert b{font-weight:600}
.alert.info{background:var(--accent-soft);color:var(--text)}
.alert.info .ico{color:var(--accent-text)}
.alert.warn{background:var(--warning-soft)}
.alert.warn .ico{color:var(--warning)}
.alert.ok{background:var(--success-soft)}
.alert.ok .ico{color:var(--success)}
.alert.err{background:var(--danger-soft)}
.alert.err .ico{color:var(--danger)}
.alert div{display:flex;flex-direction:column;gap:2px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s3);padding:var(--s9) var(--s5);border:1px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--text-2)}
.empty .ico{width:32px;height:32px;color:var(--text-3)}
.empty b{color:var(--text);font-size:var(--fs-md)}

/* ---------- 8. Форми ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:var(--fs-sm)}
.field .hint{color:var(--text-2);font-size:var(--fs-sm)}
.field .err{color:var(--danger);font-size:var(--fs-sm);display:flex;gap:6px;align-items:center}
textarea,input[type=search],input[type=number],input[type=text]{width:100%;min-height:44px;padding:11px 14px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--text);font-size:var(--fs-base);line-height:1.5;transition:border-color var(--t),box-shadow var(--t)}
textarea{resize:vertical}
textarea::placeholder,input::placeholder{color:var(--text-3)}
textarea:hover,input:hover{border-color:var(--text-3)}
textarea:focus-visible,input:focus-visible,textarea:focus,input:focus{border-color:var(--accent);box-shadow:var(--focus);border-radius:var(--r-sm)}
[aria-invalid=true]{border-color:var(--danger)!important}
.search{position:relative;max-width:520px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search input{padding-left:42px;padding-right:48px}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.mono-area{font-family:var(--mono);font-size:13px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

/* ---------- 9. Вкладки й кроки ---------- */
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:8px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;min-height:48px;cursor:pointer;color:var(--text-2);margin-bottom:-1px;font-size:var(--fs-sm);font-weight:500;white-space:nowrap;transition:color var(--t),border-color var(--t)}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tab[aria-selected=true] .ico{color:var(--accent-text)}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2);counter-reset:s}
.step-b{position:relative;display:flex;align-items:center;gap:var(--s3);text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 14px;min-height:56px;cursor:pointer;color:var(--text-2);transition:border-color var(--t),background var(--t)}
.step-b:hover{border-color:var(--border-strong)}
.step-b .ico-tile{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--text-2)}
.step-b .ico-tile .ico{width:18px;height:18px}
.step-b span.t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.step-b b{font-weight:600;color:var(--text);font-size:var(--fs-sm)}
.step-b small{font-size:var(--fs-xs);color:var(--text-2)}
.step-b[aria-current=step]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.step-b[aria-current=step] .ico-tile{background:var(--accent);color:var(--on-accent)}
.step-b.done .ico-tile{background:var(--success-soft);color:var(--success)}

/* ---------- 10. Головна ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:var(--s9);align-items:center;padding:var(--s10) 0 var(--s9)}
.hero-l{display:flex;flex-direction:column;gap:var(--s5)}
.lead{font-size:var(--fs-md);line-height:1.6;color:var(--text-2);max-width:36em}
.facts{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s6);padding-top:var(--s2);color:var(--text-2);font-size:var(--fs-sm)}
.facts span{display:inline-flex;align-items:center;gap:8px}
.facts .ico{color:var(--accent-text)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-2);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s4)}
.panel-cap{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.demo-row{display:flex;flex-direction:column;gap:var(--s2)}
.demo-lbl{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600}
.demo-lbl.x{color:var(--danger)}.demo-lbl.v{color:var(--success)}
.demo-txt{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px}
.demo-out{font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--text-2)}
.demo hr{border:0;border-top:1px solid var(--border);margin:0}
.cont{gap:var(--s5)}
.cont h3{font-family:var(--serif);font-size:var(--fs-lg);font-weight:600}
.cont .row-meta{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--text-2)}
.cont .next{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-md);background:var(--surface-2)}
.cont .next div{display:flex;flex-direction:column;gap:2px;min-width:0}
.cont .next b{font-weight:600}

.sec{padding:var(--s10) 0 0}
.sec-h{display:flex;flex-direction:column;gap:var(--s3);max-width:44rem;margin-bottom:var(--s7)}
.sec-h p{color:var(--text-2);font-size:var(--fs-md)}
.outcomes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s7) var(--s8)}
.outcome{display:flex;gap:var(--s4);align-items:flex-start}
.outcome div{display:flex;flex-direction:column;gap:6px;min-width:0}
.outcome h3{font-size:var(--fs-md)}
.outcome p{color:var(--text-2);font-size:var(--fs-sm);line-height:1.55}
.outcome .btn.link{align-self:flex-start;min-height:36px;padding:4px 0;font-size:var(--fs-sm)}
.audience{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.audience > div{padding:var(--s7);display:flex;flex-direction:column;gap:var(--s3)}
.audience > div + div{border-left:1px solid var(--border)}
.audience h3{font-family:var(--serif);font-size:var(--fs-lg)}
.audience p{color:var(--text-2);font-size:var(--fs-sm);line-height:1.6}
.audience .ico{width:26px;height:26px;color:var(--accent-text)}
.process{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s6);counter-reset:p;position:relative}
.process li{list-style:none;display:flex;flex-direction:column;gap:var(--s2);position:relative;padding-top:var(--s9)}
.process li::before{counter-increment:p;content:counter(p);position:absolute;top:0;left:0;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:17px;color:var(--accent-text)}
.process li:not(:last-child)::after{content:'';position:absolute;top:20px;left:52px;right:-12px;height:1px;background:var(--border-strong)}
.process ol{margin:0;padding:0;display:contents}
.process p{color:var(--text-2);font-size:var(--fs-sm)}

/* маршрут */
.route{display:flex;flex-direction:column;gap:var(--s4)}
.stage{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);overflow:hidden}
.stage-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s4);align-items:center;width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:var(--s5) var(--s6);min-height:72px;color:var(--text)}
.stage-h:hover{background:var(--surface-2)}
.stage-h .num{width:44px;height:44px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:19px}
.stage-h .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.stage-h .tt b{font-family:var(--serif);font-size:var(--fs-lg);font-weight:600}
.stage-h .tt span{color:var(--text-2);font-size:var(--fs-sm)}
.stage-h .side{display:flex;align-items:center;gap:var(--s4);color:var(--text-2);font-size:var(--fs-sm);white-space:nowrap}
.stage-h .side progress{width:80px}
.stage-h .chev{transition:transform .2s}
.stage-h[aria-expanded=true] .chev{transform:rotate(180deg)}
.mods{list-style:none;margin:0;padding:0 var(--s6) var(--s3);border-top:1px solid var(--border)}
.mods > li{border-bottom:1px solid var(--border)}
.mods > li:last-child{border-bottom:0}
.mod{display:grid;grid-template-columns:24px 36px minmax(0,1fr) auto;gap:var(--s4);align-items:center;width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--text);padding:var(--s4) var(--s3);margin:0 calc(var(--s3) * -1);width:calc(100% + var(--s3) * 2);border-radius:var(--r-md);transition:background var(--t)}
.mod:hover{background:var(--surface-2)}
.mod .stt{width:22px;height:22px;color:var(--text-3)}
.mod.done .stt{color:var(--success)}
.mod.cur .stt{color:var(--accent-text)}
.mod .n{font-family:var(--serif);font-size:18px;color:var(--text-3);font-variant-numeric:tabular-nums}
.mod .t{display:flex;flex-direction:column;gap:3px;min-width:0}
.mod .t b{font-weight:600;font-size:var(--fs-base)}
.mod .t > span{color:var(--text-2);font-size:var(--fs-sm)}
.mod .t small{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:var(--fs-xs);padding-top:2px}
.act{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--accent-text);white-space:nowrap;padding:8px 4px}
.act .ico{transition:transform var(--t)}
.mod:hover .act .ico{transform:translateX(3px)}
.act.now{background:var(--accent);color:var(--on-accent);padding:9px 16px;border-radius:var(--r-sm)}
.mod.cur{background:var(--accent-soft)}
.mod.cur:hover{background:color-mix(in srgb,var(--accent-soft) 80%,var(--surface-2))}

.toolsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.toolbtn{display:flex;gap:var(--s4);align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5);cursor:pointer;color:var(--text);transition:border-color var(--t),box-shadow var(--t)}
.toolbtn:hover{border-color:var(--border-strong);box-shadow:var(--sh-1)}
.toolbtn div{display:flex;flex-direction:column;gap:4px}
.toolbtn b{font-weight:600}
.toolbtn span{color:var(--text-2);font-size:var(--fs-sm)}
.foot{margin-top:var(--s11);border-top:1px solid var(--border);padding:var(--s8) 0 var(--s9);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s8);color:var(--text-2);font-size:var(--fs-sm)}
.foot div{display:flex;flex-direction:column;gap:var(--s2)}
.foot b{color:var(--text);font-size:var(--fs-base)}

/* ---------- 11. Сторінки ---------- */
.page{padding:var(--s8) 0 var(--s10);display:flex;flex-direction:column;gap:var(--s7)}
.phead{display:flex;flex-direction:column;gap:var(--s3);max-width:48rem}
.phead h1{font-size:clamp(30px,3.6vw,44px)}
.phead .lead{font-size:var(--fs-md)}
.crumb{display:flex;gap:var(--s2);align-items:center;font-size:var(--fs-sm);color:var(--text-2);flex-wrap:wrap}
.crumb button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;min-height:44px;cursor:pointer;color:var(--accent-text);font-size:var(--fs-sm)}
.crumb button:hover{text-decoration:underline}
.mprog{display:flex;align-items:center;gap:var(--s3);max-width:420px;font-size:var(--fs-sm);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* урок */
.study{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s9);align-items:start}
.toc{position:sticky;top:88px;display:flex;flex-direction:column;gap:2px}
.toc .lbl{padding:0 12px var(--s2)}
.toc button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:none;border:0;cursor:pointer;padding:10px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);line-height:1.4;color:var(--text-2);min-height:44px}
.toc button:hover{background:var(--surface-2);color:var(--text)}
.toc button[aria-current=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--sh-1),0 0 0 1px var(--border)}
.toc button .ico{width:18px;height:18px;margin-top:1px;color:var(--text-3)}
.toc button.dn .ico{color:var(--success)}
.toc button[aria-current=true] .ico{color:var(--accent-text)}
.reader{max-width:var(--read);display:flex;flex-direction:column;gap:var(--s6)}
.reader h2{font-size:clamp(26px,3vw,34px)}
.prose{font-family:var(--serif);font-size:19px;line-height:1.75;display:flex;flex-direction:column;gap:var(--s4)}
.prose h4{font-family:var(--sans);font-size:var(--fs-md);font-weight:600;margin-top:var(--s3)}
.prose ul,.prose ol{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:var(--s2)}
.prose li::marker{color:var(--text-3)}
.sb{font-weight:650}
.sc{font-family:var(--mono);font-size:.8em;background:var(--surface-2);padding:2px 6px;border-radius:5px}
.blk{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--surface-2);border-radius:var(--r-md);padding:var(--s4) var(--s5)}
.call{border-radius:var(--r-md);padding:var(--s4) var(--s5);background:var(--surface-2);display:flex;flex-direction:column;gap:4px;font-family:var(--sans);font-size:var(--fs-base);line-height:1.6}
.call.warn{background:var(--warning-soft)}
.call b{font-weight:600}
.flow{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;font-family:var(--sans)}
.flow .st{padding:8px 14px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:var(--fs-sm)}
.flow .ar{color:var(--text-3)}
.flow .ar:last-child{display:none}
.ex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.exb{border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);background:var(--surface-2);border:1px solid var(--border)}
.exb .k{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600}
.exb.b .k{color:var(--danger)}.exb.g .k{color:var(--success)}
.exb.g{background:var(--success-soft);border-color:transparent}
.exb .m{font-family:var(--mono);font-size:14px;line-height:1.6}
.tpl{border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.tpl summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);min-height:52px;font-weight:600;font-size:var(--fs-sm);border-radius:var(--r-md)}
.tpl summary::-webkit-details-marker{display:none}
.tpl summary .chev{margin-left:auto;transition:transform .2s;color:var(--text-3)}
.tpl[open] summary .chev{transform:rotate(180deg)}
.tpl summary .muted{font-weight:400}
.tpl-body{padding:0 var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.tpl pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:14px;line-height:1.65;background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s4)}
.keyidea{display:flex;gap:var(--s4);align-items:flex-start;padding:var(--s5);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border)}
.keyidea .ico-tile{background:#FFF4C2;color:#7A5A00}
.dark .keyidea .ico-tile{background:#3A3214;color:#F2C462}
.keyidea div{display:flex;flex-direction:column;gap:4px}
.keyidea p{font-family:var(--serif);font-size:var(--fs-md);line-height:1.65}
.hl{background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 90%;background-size:100% 42%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .1em}
.draw .hl{animation:draw 1s .3s cubic-bezier(.3,.7,.2,1) both}
@keyframes draw{from{background-size:0 42%}}
.lnav{display:flex;justify-content:space-between;gap:var(--s3);padding-top:var(--s5);border-top:1px solid var(--border)}
.lnav .btn.primary{margin-left:auto}
.dots{display:none;gap:6px;flex-wrap:wrap}
.dot{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:var(--fs-xs);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;padding:0;font-variant-numeric:tabular-nums;transition:all var(--t)}
.dot:hover{border-color:var(--text-3)}
.dot[aria-current=true]{border-color:var(--accent);color:var(--accent-text);font-weight:700;box-shadow:0 0 0 2px var(--accent-soft)}
.dot.ok{background:var(--success);border-color:var(--success);color:#fff}
.dot.no{background:var(--danger);border-color:var(--danger);color:#fff}
.srcs{display:flex;flex-direction:column;gap:var(--s3)}
.src{display:flex;flex-direction:column;gap:2px;padding:var(--s3) 0;border-top:1px solid var(--border)}
.src a{font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.src a:hover{text-decoration:underline}
.src span{color:var(--text-2);font-size:var(--fs-sm)}

/* практика, тест */
.narrow{max-width:46rem}
.olist{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:var(--s2)}
.olist li::marker{color:var(--text-3);font-weight:600}
.task{font-family:var(--serif);font-size:var(--fs-md);line-height:1.65}
.rub{display:flex;gap:var(--s3);align-items:flex-start;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;min-height:48px;font-size:var(--fs-base);transition:border-color var(--t),background var(--t)}
.rub:hover{border-color:var(--border-strong)}
.rub .box{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;margin-top:1px;transition:all var(--t);color:transparent}
.rub .box .ico{width:14px;height:14px}
.rub[aria-checked=true]{background:var(--success-soft);border-color:transparent}
.rub[aria-checked=true] .box{background:var(--success);border-color:var(--success);color:#fff;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
.qdots{display:flex;gap:6px;flex-wrap:wrap}
.qn{font-family:var(--serif);font-size:clamp(20px,2.2vw,24px);line-height:1.4;font-weight:600}
.opts{display:flex;flex-direction:column;gap:var(--s2)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:13px 16px;min-height:54px;font-size:var(--fs-base);line-height:1.5;transition:border-color var(--t),background var(--t)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:700;color:var(--text-2)}
.opt .tg{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;padding-top:4px}
.opt.ok{background:var(--success-soft);border-color:var(--success)}
.opt.ok .l{background:var(--success);color:#fff}
.opt.ok .tg{color:var(--success)}
.opt.no{background:var(--danger-soft);border-color:var(--danger)}
.opt.no .l{background:var(--danger);color:#fff}
.opt.no .tg{color:var(--danger)}
.opt.dim{opacity:.55}
.why{animation:rise .3s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.big{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.nextrow{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:space-between;align-items:center}

/* майстерня */
.lab{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:var(--s6);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.out{background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s4);min-height:120px;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:14px;line-height:1.65}
.ck{display:flex;gap:var(--s3);align-items:center;font-size:var(--fs-sm)}
.ck .ico{width:20px;height:20px;color:var(--text-3)}
.ck.y .ico{color:var(--success)}
.ck.n{color:var(--text-2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4);display:flex;flex-direction:column;gap:2px}
.card .stat{background:var(--surface-2);border-color:transparent}
.stat b{font-family:var(--serif);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{color:var(--text-2);font-size:var(--fs-sm)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);align-items:start}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.res{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}

/* бібліотека */
.libbar{display:flex;flex-direction:column;gap:var(--s4)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.count{font-size:var(--fs-sm);color:var(--text-2)}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--s4)}
.item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);box-shadow:var(--sh-1)}
.item .cat{font-size:var(--fs-xs)}
.item h3{font-size:var(--fs-base)}
.item pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:13.5px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:var(--s3) var(--s4);max-height:200px;overflow:auto;flex:1}
.acts{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.fav[aria-pressed=true]{color:var(--accent-text)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 var(--s8)}
.gl div{padding:var(--s4) 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.gl dt{font-weight:600;font-family:var(--serif);font-size:var(--fs-md)}
.gl dd{margin:0;color:var(--text-2);font-size:var(--fs-sm);line-height:1.6}

/* прогрес */
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) 110px auto;gap:var(--s3);align-items:center;padding:var(--s2) 0;border-top:1px solid var(--border)}
.mrow .ico{width:20px;height:20px;color:var(--text-3)}
.mrow.done .ico{color:var(--success)}
.mrow.cur .ico{color:var(--accent-text)}
.mrow .nm{min-width:0;font-size:var(--fs-sm)}
.mrow .nm b{font-variant-numeric:tabular-nums;color:var(--text-3);font-weight:500;margin-right:6px}
.miss{display:flex;flex-direction:column;gap:6px;padding:var(--s4) 0;border-top:1px solid var(--border)}
.miss b{font-weight:600}
.cert{border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s8) var(--s6);text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--s2);background:var(--surface);position:relative;overflow:hidden}
.cert::before{content:'';position:absolute;inset:0 0 auto;height:6px;background:var(--accent)}
.cert .ico{width:36px;height:36px;color:var(--accent-text)}
.split{display:flex;flex-direction:column;gap:var(--s5)}

/* проєкти */
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
.pcard{display:flex;flex-direction:column;gap:var(--s3);text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--s6);box-shadow:var(--sh-1);transition:border-color var(--t),box-shadow var(--t);color:var(--text)}
.pcard:hover{border-color:var(--border-strong);box-shadow:var(--sh-2)}
.pcard h3{font-family:var(--serif);font-size:var(--fs-lg)}
.pcard p{color:var(--text-2);font-size:var(--fs-sm);flex:1}
.pcard .foot2{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font-size:var(--fs-sm);color:var(--text-2)}

/* іспит */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s3)}
.rules li{display:flex;gap:var(--s3);align-items:flex-start}
.rules .ico{color:var(--accent-text);margin-top:2px}

/* завантаження */
.loading{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Segoe UI',system-ui,sans-serif;color:#525A68;background:#F5F6F8}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid #DDE1F7;border-top-color:#3044D0;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 12. Адаптив ---------- */
@media (max-width:1080px){
  .nav .navb .ico{display:none}
  .outcomes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .nav{display:none}
  .menu-btn{display:inline-flex}
  .hero{grid-template-columns:minmax(0,1fr);gap:var(--s7);padding:var(--s8) 0 var(--s6)}
  .audience{grid-template-columns:minmax(0,1fr)}
  .audience > div + div{border-left:0;border-top:1px solid var(--border)}
  .process{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6) var(--s5)}
  .process li:nth-child(2)::after{display:none}
  .study{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  .toc{display:none}
  .dots{display:flex}
  .lab,.row2{grid-template-columns:minmax(0,1fr)}
  .projects{grid-template-columns:minmax(0,1fr)}
  .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 var(--s4)}
  .topin{gap:var(--s2);min-height:58px}
  .pill progress{display:none}
  .brand{font-size:17px}
  .sec{padding-top:var(--s9)}
  .outcomes{grid-template-columns:minmax(0,1fr);gap:var(--s6)}
  .toolsgrid{grid-template-columns:minmax(0,1fr)}
  .process{grid-template-columns:minmax(0,1fr)}
  .process li{padding:0 0 0 56px;min-height:40px}
  .process li::after{display:none}
  .card{padding:var(--s5);border-radius:var(--r-md)}
  .panel{padding:var(--s5)}
  .stage-h{grid-template-columns:auto minmax(0,1fr) auto;padding:var(--s4);gap:var(--s3)}
  .stage-h .side progress,.stage-h .side .cnt{display:none}
  .mods{padding:0 var(--s4) var(--s2)}
  .mod{grid-template-columns:22px minmax(0,1fr);gap:var(--s3)}
  .mod .n{display:none}
  .mod .act{grid-column:2;justify-self:start;padding-left:0}
  .mod .act.now{padding:8px 14px}
  .hero-cta .btn{flex:1 1 100%}
  .prose{font-size:18px}
  .ex,.f2,.stats{grid-template-columns:minmax(0,1fr)}
  .stats.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stepper{gap:6px}
  .step-b{padding:8px 10px;gap:var(--s2);min-height:52px}
  .step-b .ico-tile{width:30px;height:30px}
  .mrow{grid-template-columns:22px minmax(0,1fr) auto}
  .mrow progress{display:none}
  .lib,.gl{grid-template-columns:minmax(0,1fr)}
  .lnav{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);margin:0 calc(var(--s4) * -1);padding:var(--s3) var(--s4);border-top:1px solid var(--border)}
  .lnav .btn{flex:1}
  .big{font-size:40px}
  .tpl summary .muted{display:none}
  .opt{flex-wrap:wrap;row-gap:4px}
  .opt > span:nth-child(2){flex:1 1 0;min-width:0}
  .opt .tg{order:3;flex-basis:100%;margin-left:40px;padding-top:0}
  .nextrow .btn{flex:1 1 auto}
  .foot{margin-top:var(--s9)}
}
